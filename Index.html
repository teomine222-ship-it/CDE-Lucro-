<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CDE Lucro — Importação Paraguai</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-page:#F4F6F4;
    --surface:#FFFFFF;
    --surface-muted:#EEF2EE;
    --accent:#128A46;
    --accent-dim:#0D6E38;
    --accent-soft:rgba(18,138,70,0.10);
    --brick:#C0392B;
    --brick-soft:rgba(192,57,43,0.10);
    --ink:#16211B;
    --muted:#6E7A72;
    --line: rgba(22,33,27,0.10);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg-page);
    font-family:'Inter',sans-serif;
    color:var(--ink);
    min-height:100vh;
    padding:32px 16px 64px;
  }
  .wrap{max-width:920px;margin:0 auto;}

  /* Header */
  header{
    display:flex; align-items:center; justify-content:space-between;
    margin-bottom:24px; flex-wrap:wrap; gap:16px;
  }
  .brand{display:flex; align-items:center; gap:12px;}
  .stamp{
    width:38px;height:38px;border-radius:10px;
    background:var(--accent);
    display:flex;align-items:center;justify-content:center;
    color:#fff; font-weight:700; font-size:15px;
    flex-shrink:0;
  }
  .brand h1{
    font-weight:700; font-size:19px;
    color:var(--ink); margin:0; letter-spacing:-0.2px;
  }
  .brand p{margin:1px 0 0; color:var(--muted); font-size:12.5px;}

  nav{display:flex; gap:4px; background:var(--surface); padding:4px; border-radius:10px; border:1px solid var(--line);}
  nav button{
    background:transparent; border:none; color:var(--muted);
    padding:8px 14px; border-radius:7px; font-family:'Inter'; font-weight:600;
    font-size:13.5px; cursor:pointer; transition:all .15s;
  }
  nav button.active{background:var(--accent); color:#fff;}
  nav button:hover:not(.active){color:var(--ink);}

  /* Cards */
  .sheet{
    background:var(--surface);
    border-radius:12px;
    padding:22px 24px;
    margin-bottom:16px;
    border:1px solid var(--line);
  }
  .sheet-title{
    font-weight:600; font-size:15px;
    margin:0 0 16px; display:flex; align-items:center; gap:8px;
    color:var(--ink);
  }
  .sheet-title .eyebrow{
    font-size:10.5px; font-weight:700;
    color:var(--accent-dim); background:var(--accent-soft);
    padding:2px 7px; border-radius:5px; letter-spacing:0.5px; text-transform:uppercase;
  }

  /* Dashboard stats */
  .stat-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; margin-bottom:6px;}
  .stat{
    background:var(--surface-muted); border-radius:10px; padding:14px 16px;
  }
  .stat .label{font-size:12px; color:var(--muted); font-weight:500;}
  .stat .value{font-family:'IBM Plex Mono'; font-weight:600; font-size:21px; margin-top:4px; color:var(--ink);}
  .stat.profit .value{color:var(--accent-dim);}
  .stat.loss .value{color:var(--brick);}

  /* Forms */
  .field-row{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px;}
  .field-row.three{grid-template-columns:1fr 1fr 1fr;}
  .field{display:flex; flex-direction:column; gap:5px;}
  .field label{font-size:12px; font-weight:500; color:var(--muted);}
  .field input, .field select{
    font-family:'Inter'; font-size:14px; padding:9px 11px;
    border:1px solid var(--line); border-radius:8px;
    background:#fff; color:var(--ink);
  }
  .field input:focus, .field select:focus{outline:2px solid var(--accent-soft); border-color:var(--accent);}
  .field input[type=number]{font-family:'IBM Plex Mono';}

  .btn{
    font-family:'Inter'; font-weight:600; font-size:13.5px;
    padding:10px 18px; border-radius:8px; border:none; cursor:pointer;
    transition:transform .1s;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--ink); color:#fff;}
  .btn-primary:hover{background:#000;}
  .btn-gold{background:var(--accent); color:#fff;}
  .btn-gold:hover{background:var(--accent-dim);}
  .btn-ghost{background:transparent; color:var(--brick); border:1px solid rgba(192,57,43,0.3); padding:6px 10px; font-size:12.5px;}
  .btn-ghost:hover{background:var(--brick-soft);}
  .btn-block{width:100%;}

  /* Table */
  table{width:100%; border-collapse:collapse; font-size:13.5px;}
  th{
    text-align:left; font-size:11px; text-transform:uppercase; letter-spacing:0.4px;
    color:var(--muted); font-weight:600; padding:8px 8px; border-bottom:1px solid var(--line);
  }
  td{padding:10px 8px; border-bottom:1px solid var(--line); vertical-align:middle;}
  td.num, th.num{font-family:'IBM Plex Mono'; text-align:right;}
  tr.total-row td{font-weight:600; border-top:1px solid var(--ink); border-bottom:none;}
  .pill{
    display:inline-block; font-size:11px; padding:2px 8px; border-radius:6px;
    background:var(--surface-muted); font-weight:600; color:var(--muted);
  }
  .pill.pos{background:var(--accent-soft); color:var(--accent-dim);}
  .pill.neg{background:var(--brick-soft); color:var(--brick);}

  /* Trip list rows */
  .trip-card{
    display:flex; justify-content:space-between; align-items:center;
    background:transparent; border-radius:0; padding:14px 4px;
    margin-bottom:0; cursor:pointer; transition:background .15s;
    border-bottom:1px solid var(--line);
  }
  .trip-card:hover{background:var(--surface-muted);}
  .trip-card:last-child{border-bottom:none;}
  .trip-card .name{font-weight:600; font-size:14px; color:var(--ink);}
  .trip-card .date{font-size:12px; color:var(--muted); font-family:'IBM Plex Mono'; margin-top:2px;}
  .trip-card .profit{font-family:'IBM Plex Mono'; font-weight:600; font-size:15px;}

  .empty{
    text-align:center; padding:32px 16px; color:var(--muted); font-size:14px;
  }
  .back-link{
    background:none; border:none; color:var(--accent-dim); font-weight:600;
    font-size:13px; cursor:pointer; padding:0; margin-bottom:14px; display:flex; align-items:center; gap:5px;
  }
  .back-link:hover{color:var(--accent);}

  .divider{border:none; border-top:1px solid var(--line); margin:18px 0;}

  select#dilution{cursor:pointer;}

  .expense-row, .product-row{
    display:grid; grid-template-columns:1fr 100px 32px; gap:8px; margin-bottom:8px; align-items:center;
  }
  .product-row{grid-template-columns:1.2fr 120px 60px 85px 85px 32px;}
  .row-head{
    display:grid; grid-template-columns:1.2fr 120px 60px 85px 85px 32px; gap:8px;
    font-size:10.5px; text-transform:uppercase; color:var(--muted); font-weight:600; margin-bottom:6px; padding:0 2px;
  }
  .field-mini{display:flex; flex-direction:column; gap:3px; min-width:0;}
  .field-mini label{
    display:none; font-size:10px; text-transform:uppercase; letter-spacing:0.3px;
    color:var(--muted); font-weight:600;
  }
  .field-mini select, .field-mini input{width:100%;}
  .field-mini.remove-wrap{align-items:center; justify-content:center;}
  .icon-btn{
    background:none; border:none; color:var(--brick); cursor:pointer; font-size:16px;
    width:28px; height:28px; display:flex; align-items:center; justify-content:center; border-radius:6px;
  }
  .icon-btn:hover{background:var(--brick-soft);}

  footer{text-align:center; color:var(--muted); font-size:11.5px; margin-top:24px;}

  @media(max-width:560px){
    .field-row, .field-row.three{grid-template-columns:1fr;}
    .row-head{display:none;}
    .product-row{grid-template-columns:1fr 1fr; row-gap:10px;}
    .field-mini label{display:block;}
    .field-mini.remove-wrap{grid-column:1 / -1; flex-direction:row; justify-content:flex-end;}
    table{font-size:12px;}
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDl_VHqCxeuXFgghyBtuJF5WxfGOEVjKjg",
  authDomain: "cde-lucro.firebaseapp.com",
  projectId: "cde-lucro",
  storageBucket: "cde-lucro.firebasestorage.app",
  messagingSenderId: "299655110398",
  appId: "1:299655110398:web:a520fa32809c160b384faf",
  measurementId: "G-GHFYF38JWB"
};

const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const db = getFirestore(fbApp);

// ---------- Storage helpers (Firestore, ligado à conta Google logada) ----------
async function saveTrips(trips){
  state.trips = trips;
  if (!state.uid) return;
  try{ await setDoc(doc(db,'cdeLucro',state.uid), { trips }, { merge:true }); }
  catch(e){ console.error('Erro ao salvar', e); alert('Não foi possível salvar na nuvem. Verifique sua internet.'); }
}
async function saveCatalog(catalog){
  state.catalog = catalog;
  if (!state.uid) return;
  try{ await setDoc(doc(db,'cdeLucro',state.uid), { catalog }, { merge:true }); }
  catch(e){ console.error('Erro ao salvar catálogo', e); alert('Não foi possível salvar na nuvem. Verifique sua internet.'); }
}
async function signIn(){
  try{ await signInWithPopup(auth, new GoogleAuthProvider()); }
  catch(e){ console.error(e); alert('Não foi possível entrar: ' + e.message); }
}
async function doSignOut(){ await signOut(auth); }

// ---------- State ----------
let state = {
  trips: [],
  catalog: [],
  view: 'dashboard', // dashboard | trips | tripDetail | monthly | products
  activeTripId: null,
  loaded: false,
  uid: null,
  userName: '',
  userPhoto: ''
};

const fmt = (n) => 'R$ ' + (isFinite(n) ? n : 0).toLocaleString('pt-BR', {minimumFractionDigits:2, maximumFractionDigits:2});
const uid = () => Math.random().toString(36).slice(2,10);

// ---------- Calculations ----------
function calcTrip(trip){
  const products = trip.products || [];
  const totalExtra = (trip.expenses||[]).reduce((s,e)=> s + (Number(e.value)||0), 0);
  const totalBuy = products.reduce((s,p)=> s + (Number(p.qty)||0)*(Number(p.buyPrice)||0), 0);
  const totalUnits = products.reduce((s,p)=> s + (Number(p.qty)||0), 0);

  const enriched = products.map(p=>{
    const catalogProduct = state.catalog.find(cp=>cp.id===p.productId);
    const name = catalogProduct ? catalogProduct.name : (p.name || '');
    const category = catalogProduct ? catalogProduct.category : (p.category || 'Outro');
    const status = p.status || 'nao_vendido';
    const qty = Number(p.qty)||0, buy = Number(p.buyPrice)||0, sell = Number(p.sellPrice)||0;
    const pTotalBuy = qty*buy;
    const pTotalSell = qty*sell;
    let extraShare = 0;
    if (trip.dilution === 'equal'){
      extraShare = totalUnits > 0 ? (totalExtra / totalUnits) * qty : 0;
    } else { // proportional (default)
      extraShare = totalBuy > 0 ? (pTotalBuy/totalBuy) * totalExtra : 0;
    }
    const profit = pTotalSell - pTotalBuy - extraShare;
    const margin = pTotalSell > 0 ? (profit/pTotalSell)*100 : 0;
    return {...p, name, category, status, pTotalBuy, pTotalSell, extraShare, profit, margin};
  });

  // Resultado calculado com base no status: só produto vendido (recebido ou a receber) conta como receita/lucro real.
  // Produto não vendido ainda é só custo parado em estoque, não lucro.
  const recebidoItems = enriched.filter(p=>p.status==='recebido');
  const aReceberItems = enriched.filter(p=>p.status==='nao_recebido');
  const naoVendidoItems = enriched.filter(p=>p.status==='nao_vendido');

  const recebidoProfit = recebidoItems.reduce((s,p)=>s+p.profit,0);
  const aReceberProfit = aReceberItems.reduce((s,p)=>s+p.profit,0);
  const recebidoReceita = recebidoItems.reduce((s,p)=>s+p.pTotalSell,0);
  const aReceberReceita = aReceberItems.reduce((s,p)=>s+p.pTotalSell,0);
  const estoqueParadoCusto = naoVendidoItems.reduce((s,p)=>s+p.pTotalBuy+p.extraShare,0);
  const estoqueParadoPotencial = naoVendidoItems.reduce((s,p)=>s+p.profit,0);

  const totalSell = recebidoReceita + aReceberReceita; // só o que já foi vendido
  const totalProfit = recebidoProfit + aReceberProfit; // lucro real (recebido + a receber), exclui não vendido

  return {
    enriched, totalBuy, totalSell, totalExtra, totalProfit, totalUnits,
    recebidoProfit, aReceberProfit, estoqueParadoCusto, estoqueParadoPotencial
  };
}

function median(nums){
  if (!nums.length) return 0;
  const s = nums.slice().sort((a,b)=>a-b);
  const mid = Math.floor(s.length/2);
  return s.length % 2 !== 0 ? s[mid] : (s[mid-1]+s[mid])/2;
}

function monthLabel(key){
  if (key === 'sem-data') return 'Sem data';
  const [y,m] = key.split('-');
  const nomes = ['Jan','Fev','Mar','Abr','Mai','Jun','Jul','Ago','Set','Out','Nov','Dez'];
  return `${nomes[Number(m)-1]}/${y}`;
}

function calcMonthly(){
  const groups = {}; // key -> { profit, revenue, trips }
  state.trips.forEach(t=>{
    const key = t.date ? t.date.slice(0,7) : 'sem-data';
    const c = calcTrip(t);
    if (!groups[key]) groups[key] = { profit:0, revenue:0, trips:0 };
    groups[key].profit += c.totalProfit;
    groups[key].revenue += c.totalSell;
    groups[key].trips += 1;
  });
  const keys = Object.keys(groups).sort();
  const rows = keys.map(k=>({ key:k, label:monthLabel(k), ...groups[k] }));
  const profits = rows.map(r=>r.profit);
  return {
    rows,
    totalProfit: profits.reduce((s,p)=>s+p,0),
    medianProfit: median(profits)
  };
}

function calcProductSuggestions(){
  const byProduct = {}; // productId -> stats
  state.trips.forEach(t=>{
    const c = calcTrip(t);
    c.enriched.forEach(p=>{
      if (!p.productId) return;
      if (!byProduct[p.productId]){
        byProduct[p.productId] = { name:p.name, category:p.category, totalProfit:0, totalRevenue:0, totalUnits:0, appearances:0, margins:[] };
      }
      const s = byProduct[p.productId];
      s.totalProfit += p.profit;
      s.totalRevenue += p.pTotalSell;
      s.totalUnits += Number(p.qty)||0;
      s.appearances += 1;
      if (p.pTotalSell > 0) s.margins.push(p.margin);
    });
  });

  const rows = Object.entries(byProduct).map(([id, s])=>{
    const avgMargin = s.margins.length ? s.margins.reduce((a,b)=>a+b,0)/s.margins.length : 0;
    return { id, ...s, avgMargin };
  });

  rows.sort((a,b)=> b.avgMargin - a.avgMargin);

  const n = rows.length;
  rows.forEach((r,i)=>{
    if (r.avgMargin <= 0) r.verdict = 'repense';
    else if (i < Math.ceil(n/3)) r.verdict = 'traga-mais';
    else if (i >= n - Math.ceil(n/3) && n > 2) r.verdict = 'repense';
    else r.verdict = 'neutro';
  });

  return rows;
}

// ---------- Render ----------
function render(){
  const app = document.getElementById('app');
  app.innerHTML = `
    <header>
      <div class="brand">
        <div class="stamp">C</div>
        <div>
          <h1>CDE Lucro</h1>
          <p>Importação Paraguai — perfumes, maquiagens e mais</p>
        </div>
      </div>
      <div style="display:flex; align-items:center; gap:14px; flex-wrap:wrap;">
        <nav>
          <button data-nav="dashboard" class="${state.view==='dashboard'?'active':''}">Início</button>
          <button data-nav="trips" class="${state.view==='trips'||state.view==='tripDetail'?'active':''}">Viagens</button>
          <button data-nav="monthly" class="${state.view==='monthly'?'active':''}">Por mês</button>
          <button data-nav="products" class="${state.view==='products'?'active':''}">Produtos</button>
          <button data-nav="suggestions" class="${state.view==='suggestions'?'active':''}">Sugestões</button>
        </nav>
        <div style="display:flex; align-items:center; gap:8px;">
          ${state.userPhoto ? `<img src="${state.userPhoto}" style="width:28px;height:28px;border-radius:50%;" referrerpolicy="no-referrer">` : ''}
          <span style="font-size:13px; color:var(--muted); max-width:120px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${escapeHtml(state.userName||'')}</span>
          <button id="signout-btn" class="btn-ghost btn" style="padding:5px 10px; font-size:12px;">Sair</button>
        </div>
      </div>
    </header>
    <div id="content"></div>
    <footer>Dados sincronizados na sua conta Google — acesse de qualquer aparelho.<br>Aplicativo criado por Teodoro Martins Peracetta. Viva o Coxa!</footer>
  `;
  document.querySelectorAll('[data-nav]').forEach(b=>{
    b.onclick = ()=>{ state.view = b.dataset.nav; state.activeTripId=null; render(); };
  });
  const signoutBtn = document.getElementById('signout-btn');
  if (signoutBtn) signoutBtn.onclick = doSignOut;

  const content = document.getElementById('content');
  if (state.view === 'dashboard') content.innerHTML = renderDashboard();
  else if (state.view === 'trips') content.innerHTML = renderTrips();
  else if (state.view === 'tripDetail') content.innerHTML = renderTripDetail();
  else if (state.view === 'monthly') content.innerHTML = renderMonthly();
  else if (state.view === 'products') content.innerHTML = renderProducts();
  else if (state.view === 'suggestions') content.innerHTML = renderSuggestions();

  attachHandlers();
}

function renderDashboard(){
  if (!state.trips.length){
    return `<div class="sheet"><div class="empty">Nenhuma viagem cadastrada ainda.<br><br>
      <button class="btn btn-gold" data-action="new-trip">+ Cadastrar primeira viagem</button></div></div>`;
  }
  const calcs = state.trips.map(t=>({t, c:calcTrip(t)}));
  const totalProfit = calcs.reduce((s,x)=>s+x.c.totalProfit,0);
  const totalRevenue = calcs.reduce((s,x)=>s+x.c.totalSell,0);
  const best = calcs.reduce((a,b)=> b.c.totalProfit > (a?.c.totalProfit ?? -Infinity) ? b : a, null);

  return `
    <div class="sheet">
      <div class="sheet-title"><span class="eyebrow">RESUMO</span> Balanço geral</div>
      <div class="stat-row">
        <div class="stat ${totalProfit>=0?'profit':'loss'}"><div class="label">Lucro total</div><div class="value">${fmt(totalProfit)}</div></div>
        <div class="stat"><div class="label">Receita total</div><div class="value">${fmt(totalRevenue)}</div></div>
        <div class="stat"><div class="label">Viagens</div><div class="value">${state.trips.length}</div></div>
        <div class="stat"><div class="label">Melhor viagem</div><div class="value" style="font-size:14px; font-family:'Inter'; font-weight:700;">${best? best.t.name : '—'}</div></div>
      </div>
    </div>
    <div class="sheet">
      <div class="sheet-title"><span class="eyebrow">HISTÓRICO</span> Lucro por viagem</div>
      ${calcs.slice().reverse().map(({t,c})=>`
        <div class="trip-card" data-open-trip="${t.id}">
          <div>
            <div class="name">${escapeHtml(t.name)}</div>
            <div class="date">${t.date ? formatDate(t.date) : ''} · ${(t.products||[]).length} produto(s)</div>
          </div>
          <div class="profit" style="color:${c.totalProfit>=0?'#2C6B4F':'var(--brick)'}">${fmt(c.totalProfit)}</div>
        </div>
      `).join('')}
    </div>
  `;
}

function renderTrips(){
  return `
    <div class="sheet">
      <div class="sheet-title"><span class="eyebrow">NOVA</span> Cadastrar viagem</div>
      <div class="field-row">
        <div class="field"><label>Nome da viagem</label><input id="new-trip-name" placeholder="Ex: Viagem Agosto 2026"></div>
        <div class="field"><label>Data</label><input id="new-trip-date" type="date"></div>
      </div>
      <button class="btn btn-primary" data-action="new-trip">+ Criar viagem</button>
    </div>
    <div class="sheet">
      <div class="sheet-title"><span class="eyebrow">TODAS</span> Suas viagens</div>
      ${state.trips.length ? state.trips.slice().reverse().map(t=>{
        const c = calcTrip(t);
        return `<div class="trip-card" data-open-trip="${t.id}">
          <div>
            <div class="name">${escapeHtml(t.name)}</div>
            <div class="date">${t.date? formatDate(t.date):''} · ${(t.products||[]).length} produto(s)</div>
          </div>
          <div class="profit" style="color:${c.totalProfit>=0?'#2C6B4F':'var(--brick)'}">${fmt(c.totalProfit)}</div>
        </div>`;
      }).join('') : `<div class="empty">Nenhuma viagem ainda. Crie a primeira acima.</div>`}
    </div>
  `;
}

function renderMonthly(){
  const { rows, totalProfit, medianProfit } = calcMonthly();

  if (!rows.length){
    return `<div class="sheet"><div class="empty">Nenhuma viagem cadastrada ainda.<br>Cadastre viagens com data para ver o lucro por mês.</div></div>`;
  }

  const maxProfit = Math.max(...rows.map(r=>Math.abs(r.profit)), 1);

  return `
    <div class="sheet">
      <div class="sheet-title"><span class="eyebrow">RESUMO</span> Lucro por mês</div>
      <div class="stat-row">
        <div class="stat ${totalProfit>=0?'profit':'loss'}"><div class="label">Lucro total</div><div class="value">${fmt(totalProfit)}</div></div>
        <div class="stat ${medianProfit>=0?'profit':'loss'}"><div class="label">Lucro mediano mensal</div><div class="value">${fmt(medianProfit)}</div></div>
        <div class="stat"><div class="label">Meses com viagens</div><div class="value">${rows.length}</div></div>
      </div>
    </div>
    <div class="sheet">
      <div class="sheet-title"><span class="eyebrow">DETALHE</span> Mês a mês</div>
      <table>
        <thead><tr>
          <th>Mês</th><th class="num">Viagens</th><th class="num">Receita</th><th class="num">Lucro</th><th></th>
        </tr></thead>
        <tbody>
          ${rows.map(r=>`
            <tr>
              <td>${escapeHtml(r.label)}</td>
              <td class="num">${r.trips}</td>
              <td class="num">${fmt(r.revenue)}</td>
              <td class="num">${fmt(r.profit)}</td>
              <td style="width:120px;">
                <div style="background:${r.profit>=0?'rgba(44,107,79,0.18)':'rgba(181,66,62,0.18)'}; height:8px; border-radius:5px; overflow:hidden;">
                  <div style="width:${Math.min(100,(Math.abs(r.profit)/maxProfit)*100)}%; height:100%; background:${r.profit>=0?'#2C6B4F':'var(--brick)'};"></div>
                </div>
              </td>
            </tr>
          `).join('')}
          <tr class="total-row">
            <td>Total</td>
            <td class="num">${rows.reduce((s,r)=>s+r.trips,0)}</td>
            <td class="num">${fmt(rows.reduce((s,r)=>s+r.revenue,0))}</td>
            <td class="num">${fmt(totalProfit)}</td>
            <td></td>
          </tr>
        </tbody>
      </table>
    </div>
  `;
}

      </div>

function renderSuggestions(){
  const rows = calcProductSuggestions();

  if (!rows.length){
    return `<div class="sheet"><div class="empty">Ainda não há dados suficientes.<br>Cadastre viagens com produtos vendidos para ver quais valem mais a pena trazer de novo.</div></div>`;
  }

  const verdictInfo = {
    'traga-mais': { label:'Traga mais', pill:'pos', blurb:'Boa margem consistente — vale priorizar na próxima viagem.' },
    'neutro':     { label:'Neutro', pill:'', blurb:'Desempenho mediano — pode manter no volume atual.' },
    'repense':    { label:'Repense trazer', pill:'neg', blurb:'Margem baixa ou negativa — avalie reduzir a quantidade ou o preço de compra.' }
  };

  return `
    <div class="sheet">
      <div class="sheet-title"><span class="eyebrow">SUGESTÕES</span> Quais produtos vale mais a pena trazer de novo</div>
      <p style="font-size:13px; color:var(--muted); margin:-4px 0 18px;">
        Análise automática com base no lucro e na margem de cada produto nas viagens já cadastradas — sem depender de internet.
      </p>
      ${rows.map(r=>{
        const v = verdictInfo[r.verdict];
        return `
        <div class="trip-card" style="cursor:default;">
          <div>
            <div class="name">${escapeHtml(r.name)} <span class="pill" style="margin-left:6px;">${escapeHtml(r.category)}</span></div>
            <div class="date" style="margin-top:4px;">${r.appearances} viagem(ns) · ${r.totalUnits} unidade(s) vendida(s) · margem média ${r.avgMargin.toFixed(1)}%</div>
            <div style="font-size:12.5px; color:var(--muted); margin-top:4px; max-width:420px;">${v.blurb}</div>
          </div>
          <div style="text-align:right;">
            <span class="pill ${v.pill}" style="font-size:12px; padding:4px 10px;">${v.label}</span>
            <div class="profit" style="margin-top:6px; font-size:14px;">${fmt(r.totalProfit)}</div>
          </div>
        </div>
      `;}).join('')}
    </div>
  `;
}

function renderTripDetail(){
  const trip = state.trips.find(t=>t.id===state.activeTripId);
  if (!trip) return `<div class="empty">Viagem não encontrada.</div>`;
  const c = calcTrip(trip);

  return `
    <button class="back-link" data-action="back-to-trips">&larr; Voltar para viagens</button>

    <div class="sheet">
      <div class="sheet-title"><span class="eyebrow">VIAGEM</span> ${escapeHtml(trip.name)}</div>
      <div class="field-row three">
        <div class="field"><label>Nome</label><input id="trip-name" value="${escapeAttr(trip.name)}"></div>
        <div class="field"><label>Data</label><input id="trip-date" type="date" value="${trip.date||''}"></div>
        <div class="field"><label>Diluir gastos extras por</label>
          <select id="dilution">
            <option value="proportional" ${trip.dilution!=='equal'?'selected':''}>Proporcional ao valor de compra</option>
            <option value="equal" ${trip.dilution==='equal'?'selected':''}>Igualmente por unidade</option>
          </select>
        </div>
      </div>
    </div>

    <div class="sheet">
      <div class="sheet-title"><span class="eyebrow">PARTE 1</span> Gastos extras da viagem</div>
      <div id="expenses-list">
        ${(trip.expenses||[]).map(e=>`
          <div class="expense-row" data-expense-id="${e.id}">
            <div class="field"><input class="exp-desc" placeholder="Descrição (ex: passagem)" value="${escapeAttr(e.desc)}"></div>
            <div class="field"><input class="exp-value" type="number" step="0.01" placeholder="Valor" value="${e.value}"></div>
            <button class="icon-btn" data-remove-expense="${e.id}" title="Remover">✕</button>
          </div>
        `).join('')}
      </div>
      <button class="btn btn-ghost" style="color:var(--gold-dim); border-color:rgba(31,162,74,0.4);" data-action="add-expense">+ Adicionar gasto</button>
      <hr class="divider">
      <div style="text-align:right; font-family:'IBM Plex Mono'; font-weight:600;">Total de gastos extras: ${fmt(c.totalExtra)}</div>
    </div>

    <div class="sheet">
      <div class="sheet-title"><span class="eyebrow">PARTE 2 e 3</span> Produtos — compra e venda</div>
      ${!state.catalog.length ? `<div class="empty">Cadastre produtos na aba <strong>Produtos</strong> primeiro, aí você só clica em qual está vendendo aqui.</div>` : `
      <div class="row-head">
        <div>Produto</div><div>Status</div><div>Qtd</div><div>Preço compra</div><div>Preço venda</div><div></div>
      </div>
      <div id="products-list">
        ${(trip.products||[]).map(p=>`
          <div class="product-row" data-product-id="${p.id}">
            <div class="field-mini">
              <label>Produto</label>
              <select class="p-product">
                <option value="">Selecione o produto…</option>
                ${state.catalog.map(cp=>`<option value="${cp.id}" ${p.productId===cp.id?'selected':''}>${escapeHtml(cp.name)}</option>`).join('')}
              </select>
            </div>
            <div class="field-mini">
              <label>Status</label>
              <select class="p-status">
                <option value="nao_vendido" ${(!p.status||p.status==='nao_vendido')?'selected':''}>Não vendido</option>
                <option value="nao_recebido" ${p.status==='nao_recebido'?'selected':''}>Vendido, não recebido</option>
                <option value="recebido" ${p.status==='recebido'?'selected':''}>Vendido, recebido</option>
              </select>
            </div>
            <div class="field-mini">
              <label>Qtd</label>
              <input class="p-qty" type="number" min="0" value="${p.qty}">
            </div>
            <div class="field-mini">
              <label>Preço compra</label>
              <input class="p-buy" type="number" step="0.01" min="0" value="${p.buyPrice}">
            </div>
            <div class="field-mini">
              <label>Preço venda</label>
              <input class="p-sell" type="number" step="0.01" min="0" value="${p.sellPrice}">
            </div>
            <div class="field-mini remove-wrap">
              <button class="icon-btn" data-remove-product="${p.id}" title="Remover">✕</button>
            </div>
          </div>
        `).join('')}
      </div>
      <button class="btn btn-ghost" style="color:var(--gold-dim); border-color:rgba(31,162,74,0.4);" data-action="add-product">+ Adicionar produto</button>
      `}
    </div>

    <div class="sheet">
      <div class="sheet-title"><span class="eyebrow">RESULTADO</span> Lucro calculado por status</div>
      ${c.enriched.length ? `
      <div class="stat-row" style="margin-bottom:18px;">
        <div class="stat profit"><div class="label">Recebido</div><div class="value">${fmt(c.recebidoProfit)}</div></div>
        <div class="stat"><div class="label">A receber</div><div class="value">${fmt(c.aReceberProfit)}</div></div>
        <div class="stat"><div class="label">Parado em estoque (custo)</div><div class="value">${fmt(c.estoqueParadoCusto)}</div></div>
      </div>
      <table>
        <thead><tr>
          <th>Produto</th><th>Status</th><th class="num">Compra</th><th class="num">Venda</th><th class="num">Rateio extra</th><th class="num">Lucro</th><th class="num">Margem</th>
        </tr></thead>
        <tbody>
          ${c.enriched.map(p=>{
            const statusInfo = {
              recebido: {label:'Recebido', pill:'pos'},
              nao_recebido: {label:'A receber', pill:''},
              nao_vendido: {label:'Não vendido', pill:'neg'}
            }[p.status] || {label:'Não vendido', pill:'neg'};
            return `
            <tr>
              <td>${escapeHtml(p.name||'—')}</td>
              <td><span class="pill ${statusInfo.pill}">${statusInfo.label}</span></td>
              <td class="num">${fmt(p.pTotalBuy)}</td>
              <td class="num">${fmt(p.pTotalSell)}</td>
              <td class="num">${fmt(p.extraShare)}</td>
              <td class="num">${fmt(p.profit)}</td>
              <td class="num"><span class="pill ${p.margin>=0?'pos':'neg'}">${p.margin.toFixed(1)}%</span></td>
            </tr>
          `;}).join('')}
          <tr class="total-row">
            <td>Total (vendido)</td>
            <td></td>
            <td class="num">${fmt(c.totalBuy)}</td>
            <td class="num">${fmt(c.totalSell)}</td>
            <td class="num">${fmt(c.totalExtra)}</td>
            <td class="num">${fmt(c.totalProfit)}</td>
            <td class="num">${c.totalSell>0 ? ((c.totalProfit/c.totalSell)*100).toFixed(1) : '0.0'}%</td>
          </tr>
        </tbody>
      </table>
      <p style="font-size:12px; color:var(--muted); margin:10px 2px 0;">Compra e rateio extra somam todos os produtos (o custo já foi pago). Venda, lucro e margem do total consideram só o que já foi vendido — produtos não vendidos aparecem na linha deles com o lucro que teriam <em>se</em> vendidos, mas não entram no total.</p>
      ` : `<div class="empty">Adicione produtos acima para ver o cálculo.</div>`}
    </div>

    <button class="btn btn-ghost" data-action="delete-trip">Excluir esta viagem</button>
  `;
}

function attachHandlers(){
  document.querySelectorAll('[data-open-trip]').forEach(el=>{
    el.onclick = ()=>{ state.activeTripId = el.dataset.openTrip; state.view='tripDetail'; render(); };
  });

  const backBtn = document.querySelector('[data-action="back-to-trips"]');
  if (backBtn) backBtn.onclick = ()=>{ state.view='trips'; state.activeTripId=null; render(); };

  const newTripBtn = document.querySelector('[data-action="new-trip"]');
  if (newTripBtn) newTripBtn.onclick = async ()=>{
    const nameEl = document.getElementById('new-trip-name');
    const dateEl = document.getElementById('new-trip-date');
    const name = nameEl ? nameEl.value.trim() : '';
    const date = dateEl ? dateEl.value : '';
    if (!name){ alert('Dê um nome para a viagem.'); return; }
    const trip = { id:uid(), name, date, dilution:'proportional', expenses:[], products:[] };
    state.trips.push(trip);
    await saveTrips(state.trips);
    state.activeTripId = trip.id; state.view='tripDetail'; render();
  };

  // Product catalog handlers
  const addCatalogBtn = document.querySelector('[data-action="add-catalog-product"]');
  if (addCatalogBtn) addCatalogBtn.onclick = async ()=>{
    const nameEl = document.getElementById('new-prod-name');
    const catEl = document.getElementById('new-prod-cat');
    const buyEl = document.getElementById('new-prod-buy');
    const sellEl = document.getElementById('new-prod-sell');
    const name = nameEl.value.trim();
    if (!name){ alert('Dê um nome para o produto.'); return; }
    state.catalog.push({
      id:uid(), name, category:catEl.value,
      defaultBuy: Number(buyEl.value)||0, defaultSell: Number(sellEl.value)||0
    });
    await saveCatalog(state.catalog);
    render();
  };
  document.querySelectorAll('[data-remove-catalog]').forEach(b=>{
    b.onclick = async ()=>{
      if (!confirm('Remover este produto do catálogo? Viagens que já usam ele mantêm o nome salvo.')) return;
      state.catalog = state.catalog.filter(p=>p.id!==b.dataset.removeCatalog);
      await saveCatalog(state.catalog);
      render();
    };
  });

  // Trip detail live fields
  const tripNameEl = document.getElementById('trip-name');
  if (tripNameEl){
    const trip = state.trips.find(t=>t.id===state.activeTripId);
    tripNameEl.onchange = async ()=>{ trip.name = tripNameEl.value; await saveTrips(state.trips); render(); };
    document.getElementById('trip-date').onchange = async (e)=>{ trip.date = e.target.value; await saveTrips(state.trips); };
    document.getElementById('dilution').onchange = async (e)=>{ trip.dilution = e.target.value; await saveTrips(state.trips); render(); };

    document.querySelector('[data-action="add-expense"]').onclick = async ()=>{
      trip.expenses = trip.expenses || [];
      trip.expenses.push({id:uid(), desc:'', value:0});
      await saveTrips(state.trips); render();
    };
    document.querySelectorAll('[data-remove-expense]').forEach(b=>{
      b.onclick = async ()=>{
        trip.expenses = trip.expenses.filter(e=>e.id!==b.dataset.removeExpense);
        await saveTrips(state.trips); render();
      };
    });
    document.querySelectorAll('.expense-row').forEach(row=>{
      const id = row.dataset.expenseId;
      const exp = trip.expenses.find(e=>e.id===id);
      row.querySelector('.exp-desc').onchange = async (e)=>{ exp.desc=e.target.value; await saveTrips(state.trips); };
      row.querySelector('.exp-value').onchange = async (e)=>{ exp.value=Number(e.target.value)||0; await saveTrips(state.trips); render(); };
    });

    const addProductBtn = document.querySelector('[data-action="add-product"]');
    if (addProductBtn) addProductBtn.onclick = async ()=>{
      trip.products = trip.products || [];
      const first = state.catalog[0];
      trip.products.push({id:uid(), productId: first ? first.id : '', status:'nao_vendido', qty:1, buyPrice: first ? (first.defaultBuy||0) : 0, sellPrice: first ? (first.defaultSell||0) : 0});
      await saveTrips(state.trips); render();
    };
    document.querySelectorAll('[data-remove-product]').forEach(b=>{
      b.onclick = async ()=>{
        trip.products = trip.products.filter(p=>p.id!==b.dataset.removeProduct);
        await saveTrips(state.trips); render();
      };
    });
    document.querySelectorAll('.product-row').forEach(row=>{
      const id = row.dataset.productId;
      const prod = trip.products.find(p=>p.id===id);
      const selectEl = row.querySelector('.p-product');
      if (selectEl) selectEl.onchange = async (e)=>{
        prod.productId = e.target.value;
        const cp = state.catalog.find(c=>c.id===prod.productId);
        if (cp){ prod.buyPrice = cp.defaultBuy||0; prod.sellPrice = cp.defaultSell||0; }
        await saveTrips(state.trips); render();
      };
      const statusEl = row.querySelector('.p-status');
      if (statusEl) statusEl.onchange = async (e)=>{
        prod.status = e.target.value;
        await saveTrips(state.trips); render();
      };
      row.querySelector('.p-qty').onchange = async (e)=>{ prod.qty=Number(e.target.value)||0; await saveTrips(state.trips); render(); };
      row.querySelector('.p-buy').onchange = async (e)=>{ prod.buyPrice=Number(e.target.value)||0; await saveTrips(state.trips); render(); };
      row.querySelector('.p-sell').onchange = async (e)=>{ prod.sellPrice=Number(e.target.value)||0; await saveTrips(state.trips); render(); };
    });

    const delBtn = document.querySelector('[data-action="delete-trip"]');
    if (delBtn) delBtn.onclick = async ()=>{
      if (!confirm('Excluir esta viagem? Essa ação não pode ser desfeita.')) return;
      state.trips = state.trips.filter(t=>t.id!==state.activeTripId);
      await saveTrips(state.trips);
      state.view='trips'; state.activeTripId=null; render();
    };
  }
}

function escapeHtml(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function escapeAttr(s){ return escapeHtml(s); }
function formatDate(d){
  try{ const [y,m,day] = d.split('-'); return `${day}/${m}/${y}`; }catch(e){ return d; }
}

function renderLogin(){
  document.getElementById('app').innerHTML = `
    <div style="min-height:80vh; display:flex; align-items:center; justify-content:center;">
      <div class="sheet" style="max-width:340px; width:100%; text-align:center;">
        <div class="stamp" style="margin:0 auto 16px;">C</div>
        <h1 style="margin:0 0 4px; font-size:19px;">CDE Lucro</h1>
        <p style="color:var(--muted); font-size:13px; margin:0 0 20px;">Entre com sua conta Google para acessar seus dados de qualquer aparelho.</p>
        <button class="btn btn-gold btn-block" id="google-signin-btn">Entrar com Google</button>
      </div>
    </div>
  `;
  document.getElementById('google-signin-btn').onclick = signIn;
}

// ---------- Init ----------
document.getElementById('app').innerHTML = `<div class="sheet"><div class="empty">Carregando...</div></div>`;
onAuthStateChanged(auth, async (user)=>{
  if (user){
    state.uid = user.uid;
    state.userName = user.displayName || '';
    state.userPhoto = user.photoURL || '';
    document.getElementById('app').innerHTML = `<div class="sheet"><div class="empty">Carregando seus dados...</div></div>`;
    try{
      const ref = doc(db, 'cdeLucro', user.uid);
      const snap = await getDoc(ref);
      if (snap.exists()){
        const data = snap.data();
        state.trips = data.trips || [];
        state.catalog = data.catalog || [];
      } else {
        state.trips = []; state.catalog = [];
        await setDoc(ref, { trips: [], catalog: [] });
      }
    }catch(e){
      console.error('Erro ao carregar dados', e);
      alert('Não foi possível carregar seus dados. Verifique sua internet e tente novamente.');
    }
    state.loaded = true;
    render();
  } else {
    state.uid = null; state.trips = []; state.catalog = [];
    renderLogin();
  }
});
